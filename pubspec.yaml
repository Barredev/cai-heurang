name: caiheurang
description: Air Jernih - Habit tracker air minum + game tanaman virtual
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database lokal
  hive_flutter: ^1.1.0

  # Notifikasi lokal
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Animasi
  lottie: ^3.1.2

  # Share & file
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # UUID
  uuid: ^4.4.0

  # Format tanggal
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  # Font Nunito wajib didownload manual dari Google Fonts
  # lalu taruh di assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800